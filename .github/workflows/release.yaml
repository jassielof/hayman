name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            args: ''
          - name: Windows x86_64
            platform: windows-latest
            args: ''
          - name: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        run: bun run version:check

      - name: Build and attach Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hayman v__VERSION__
          releaseBody: |
            This is a release candidate for Hayman 0.1.0.

            Installers are currently unsigned. Your operating system may display a security warning.
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          args: ${{ matrix.args }}
