name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun lint
      - name: Check
        run: bun check
      - name: Test
        run: bun run test
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      - name: Build (preview)
        run: bun run build
      - name: Capture PWA screenshots
        run: bun run screenshots
      - name: Build (with screenshots)
        run: bun run build
